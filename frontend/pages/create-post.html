<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIA</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div id="header-container"></div>

    <form id="new-post" class="form-create-post" onsubmit="createPost(event)">
        <h1 class="new-detail-container">Crear un Nuevo Post</h1>

        <label for="title">Título</label>
        <input type="text" id="title" maxlength="30" required placeholder="Ingresa el título">

        <label for="image-url">URL de la Imagen</label>
        <input type="url" id="image-url" maxlength="500" required placeholder="Ingresa la url de la imagen">

        <label for="content">Contenido</label>
        <textarea id="content" maxlength="900" required placeholder="Ingresa el cuerpo de la noticia..."></textarea>

        <label for="category">Categoría</label>
        <select id="category" required>
            <option value="Novedad">Novedad</option>
            <option value="Tecnologia">Tecnología</option>
            <option value="Programas">Programas</option>
        </select>

        <button type="submit">Crear Post</button>
    </form>
    <script src="/script.js"></script>
</body>

</html>
