<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%"
     fill="none" style="color:#1F2937">
    <!-- PostIA: sobre + cursor. Minimalista, sin fondo ni resplandor.
         El trazo usa currentColor (hereda el color del texto); el cursor usa el ámbar de marca. -->

    <defs>
        <!-- Silueta del cursor engrosada: recorta el sobre para que el puntero
             respire sin necesidad de un fondo opaco. -->
        <mask id="cursorKnockout">
            <rect width="64" height="64" fill="#fff" />
            <path d="M0 0 L0 16.5 L4.2 12.6 L7.6 19.6 L11 18 L7.7 11.2 L13.2 10.6 Z"
                  transform="translate(33.5 23.5) scale(0.95)"
                  fill="#000" stroke="#000" stroke-width="5"
                  stroke-linejoin="round" stroke-linecap="round" />
        </mask>
    </defs>

    <!-- Sobre -->
    <g mask="url(#cursorKnockout)" stroke="currentColor" stroke-width="3.6"
       stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="14" width="52" height="36" rx="9" />
        <path d="M11 19.5 L32 36 L53 19.5" />
    </g>

    <!-- Cursor -->
    <path d="M0 0 L0 16.5 L4.2 12.6 L7.6 19.6 L11 18 L7.7 11.2 L13.2 10.6 Z"
          transform="translate(33.5 23.5) scale(0.95)"
          fill="#FFC107" stroke="#FFC107" stroke-width="1.6"
          stroke-linejoin="round" stroke-linecap="round" />
</svg>
